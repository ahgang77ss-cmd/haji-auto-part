services:
  - type: web
    name: haji-auto-parts
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN1_PHONE
        sync: false
      - key: ADMIN1_PASSWORD
        sync: false
      - key: ADMIN2_PHONE
        sync: false
      - key: ADMIN2_PASSWORD
        sync: false
