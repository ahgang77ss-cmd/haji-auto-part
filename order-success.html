<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سفارش با موفقیت ثبت شد | برادران حاجی</title><style>
:root{--bg:#090e13;--panel:#111820;--line:#2a3744;--text:#f6f2e9;--muted:#94a1ae;--amber:#f5b21b;--green:#42d17b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#202a31 0,#090e13 48%);color:var(--text);font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center}.card{width:min(680px,92vw);background:rgba(17,24,32,.95);border:1px solid var(--line);border-radius:24px;padding:40px 28px;box-shadow:0 35px 100px rgba(0,0,0,.5);text-align:center}.icon{width:82px;height:82px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(66,209,123,.45);background:rgba(66,209,123,.09);color:var(--green);font-size:40px}.eyebrow{color:var(--amber);font-size:12px;font-weight:900;letter-spacing:.4px}.card h1{font-size:28px;margin:10px 0}.card p{color:var(--muted);line-height:2;font-size:13px}.code{margin:24px 0;padding:17px;border:1px dashed rgba(245,178,27,.5);border-radius:14px;background:rgba(245,178,27,.05)}.code small{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.code strong{font-size:22px;color:var(--amber);letter-spacing:1px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{display:inline-block;text-decoration:none;border-radius:11px;padding:12px 18px;font-weight:900;font-size:13px}.primary{background:var(--amber);color:#171008}.secondary{border:1px solid var(--line);color:var(--text);background:var(--panel)}.details{margin-top:20px;color:var(--muted);font-size:11px}@media(max-width:520px){.card{padding:30px 18px}.card h1{font-size:23px}.code strong{font-size:18px}}
</style></head><body><main class="card"><div class="icon">✓</div><div class="eyebrow">لوازم یدکی برادران حاجی</div><h1>سفارش با موفقیت ثبت شد 🎉</h1><p>اطلاعات سفارش با موفقیت برای فروشگاه ارسال شد. کارشناسی سفارش از طریق اطلاعات تماس ثبت‌شده انجام می‌شود.</p><div class="code"><small>کد پیگیری سفارش</small><strong id="code">—</strong></div><div class="actions"><a class="btn primary" href="index.html#cars">ادامه خرید</a><a class="btn secondary" href="index.html">بازگشت به صفحه اصلی</a></div><div class="details" id="details"></div></main><script>const q=new URLSearchParams(location.search);const id=q.get('order')||'—';document.querySelector('#code').textContent=id;try{const o=JSON.parse(localStorage.getItem('hajiLastOrder')||'null');if(o&&o.id===id){document.querySelector('#details').textContent=(o.items||[]).reduce((s,x)=>s+x.qty,0).toLocaleString('fa-IR')+' کالا · '+Number(o.total||0).toLocaleString('fa-IR')+' تومان'}}catch(e){}</script></body></html>
